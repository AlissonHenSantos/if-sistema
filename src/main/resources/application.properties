spring.application.name=ifsystem
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ifsystem}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# External room source: CSV export or file:/absolute/path.csv. Never commit credentials.
app.rooms.location=${ROOMS_LOCATION:https://docs.google.com/spreadsheets/d/1KKREZRFIJuv5r7Oj8v7Eak54i_xZWs8bt-trL9PEY6Y/export?format=csv&gid=1107580491}
app.rooms.name-column=${ROOMS_NAME_COLUMN:Sala / Local}
app.rooms.id-column=${ROOMS_ID_COLUMN:}
app.rooms.cache-ttl=${ROOMS_CACHE_TTL:PT5M}
app.rooms.zone=${ROOMS_ZONE:America/Sao_Paulo}
