# Local development: JPA repositories use H2; rooms are read from the real Google Sheet.
server.port=${DEV_PORT:8081}
spring.datasource.url=jdbc:h2:mem:ifsystem-dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:demo/lock-schema.sql
app.rooms.location=${ROOMS_LOCATION:https://docs.google.com/spreadsheets/d/1KKREZRFIJuv5r7Oj8v7Eak54i_xZWs8bt-trL9PEY6Y/export?format=csv&gid=1107580491}
app.rooms.name-column=${ROOMS_NAME_COLUMN:Sala / Local}
app.rooms.id-column=${ROOMS_ID_COLUMN:}
