# Local, disposable demonstration. Does not use DB_URL, DB_PASSWORD or the live spreadsheet.
spring.datasource.url=jdbc:h2:mem:ifsystem-demo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:demo/lock-schema.sql
app.rooms.location=classpath:demo/rooms.csv
app.rooms.name-column=Sala / Local
app.rooms.id-column=
