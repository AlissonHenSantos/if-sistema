spring.datasource.url=jdbc:h2:mem:ifsystem;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
app.rooms.location=classpath:rooms-test.csv
app.rooms.name-column=Sala / Local
app.rooms.cache-ttl=PT0S
app.rooms.zone=America/Sao_Paulo
app.jwt.secret=only-for-tests-secret-at-least-32-characters
app.jwt.expiration-ms=86400000
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.jdbc=WARN
